<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>维吾尔语电影翻译</title>
<style>:root{--bg:#09090b;--card:#18181b;--border:#27272a;--accent:#8b5cf6;--danger:#ef4444;--text:#f4f4f5;--muted:#a1a1aa}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px}.subtitle-bar{text-align:center;padding:12px 16px;border-radius:14px;background:rgba(0,0,0,.4);border:1px solid var(--border);min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.subtitle-bar .orig{font-size:.75rem;color:var(--muted)}.subtitle-bar .trans{font-size:1.15rem;font-weight:700;color:#fff;word-break:break-word;line-height:1.4}.main-btn{width:100%;padding:16px 24px;border-radius:100px;border:none;cursor:pointer;font-weight:700;font-size:1rem;transition:all .3s;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;-webkit-appearance:none}.main-btn:active{transform:scale(.97)}.main-btn.rec{background:var(--danger);animation:p 2s infinite}@keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 16px rgba(239,68,68,0)}}.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.dot.idle{background:var(--muted)}.dot.listening{background:#22c55e}.dot.translating{background:#f59e0b}.dot.speaking{background:#8b5cf6}.log-panel{max-height:120px;overflow-y:auto;-webkit-overflow-scrolling:touch;font-family:monospace;font-size:.6rem;color:var(--muted);line-height:1.5;background:rgba(0,0,0,.2);border-radius:10px;padding:8px 10px}.ok{color:#4ade80}.err{color:#f87171}.warn{color:#f59e0b}.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.25)}.test-btn{width:100%;padding:10px;border-radius:12px;border:1px dashed var(--border);background:0 0;color:var(--muted);cursor:pointer;font-size:.8rem;font-family:inherit;-webkit-appearance:none}.test-btn:active{border-color:var(--accent);color:#a78bfa}.text-input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font-size:1rem;font-family:inherit;outline:none;-webkit-appearance:none}.text-input:focus{border-color:var(--accent)}.text-input::placeholder{color:var(--muted)}</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
<div class="w-full max-w-md mx-auto flex flex-col gap-3">
<div class="text-center"><span class="text-2xl">🎬</span><h1 class="text-lg font-bold">维吾尔语电影翻译</h1></div>
<div class="card space-y-3">

<div class="row"><span class="dot idle" id="dot"></span><span class="text-sm flex-1" id="st">就绪 — 输入中文 → 维吾尔语朗读</span></div>

<div class="flex gap-2"><input type="text" class="text-input flex-1" id="ti" placeholder="输入中文台词..." autocomplete="off"><button class="main-btn" style="width:auto;padding:12px 18px;white-space:nowrap" onclick="sendText()">📤 翻译</button></div>

<button class="main-btn" id="mb" onclick="toggle()"><span>🎤</span><span id="mbt">语音监听 (Chrome)</span></button>

<div class="subtitle-bar"><span class="orig" id="origTxt">输入文字或按语音按钮</span><span class="trans" id="transTxt"></span></div>

<button class="test-btn" onclick="testBeep()">🔔 蜂鸣测试</button>
<button class="test-btn" onclick="testFull()">🔊 完整测试 (ياخشىمۇسىز)</button>
<div class="log-panel" id="log"></div>
</div>
<p class="text-[10px] text-[var(--muted)] text-center">Google 翻译 + Google TTS · 维吾尔语真声 · 无需 API 密钥</p>
</div>

<script>
var queue=[],busy=!1,audioCtx=null,active=!1,rec=null;

function L(m,c){var e=document.getElementById('log'),t=new Date;t=t.toLocaleTimeString('zh-CN',{hour12:!1});e.innerHTML+='<div class="'+(c||'')+'">'+t+' '+m+'</div>';e.scrollTop=e.scrollHeight;while(e.children.length>35)e.firstChild.remove()}

function getAC(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}return audioCtx}

function SS(s,m){document.getElementById('dot').className='dot '+s;document.getElementById('st').textContent=m}

function sub(orig,trans){document.getElementById('origTxt').textContent=orig||'';document.getElementById('transTxt').textContent=trans||''}

// ── BEEP ──
function testBeep(){L('🔔 蜂鸣...','warn');try{var c=getAC(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=440;g.gain.value=.3;o.start();o.stop(c.currentTime+.5);L('✅ 蜂鸣播放中！','ok')}catch(e){L('❌ 蜂鸣失败','err')}}

// ── TRANSLATE (Google) ──
function tr(text){
  sub(text,'⏳ 翻译中...');
  var u='https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=ug&dt=t&q='+encodeURIComponent(text);
  return fetch(u,{signal:AbortSignal.timeout(10000)}).then(function(r){return r.json()}).then(function(d){
    if(d&&d[0]){var t=d[0].map(function(p){return p[0]}).join('');L('✓ 翻译: '+t.slice(0,35),'ok');return t}
    throw new Error('no data');
  }).catch(function(e){
    L('❌ 翻译失败: '+e.message,'err');
    sub(text,'❌ 翻译失败 - 请检查网络');
    return null;
  });
}

// ── TTS (Google) ──
function speak(text){
  L('🔊 TTS: '+text.slice(0,35));SS('speaking','朗读中');
  var u='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ug&q='+encodeURIComponent(text);
  return fetch(u,{signal:AbortSignal.timeout(15000)}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.arrayBuffer();
  }).then(function(buf){
    if(buf.byteLength<500)throw new Error('音频太小');
    L('  ✓ 下载 size='+buf.byteLength,'ok');
    var ctx=getAC();
    return ctx.decodeAudioData(buf);
  }).then(function(ab){
    var src=getAC().createBufferSource();src.buffer=ab;src.connect(getAC().destination);
    return new Promise(function(resolve){
      src.onended=function(){L('  ▶ 播放完毕','ok');sub('',text);resolve()};
      src.start();
      L('  ▶ 播放中','ok');
    });
  }).catch(function(e){
    L('  TTS失败: '+e.message,'err');
    L('  ⚠ 仅显示字幕','warn');
    sub('',text);
  });
}

// ── SEND TEXT ──
function sendText(){var inp=document.getElementById('ti'),text=inp.value.trim();if(!text)return;inp.value='';L('⌨ '+text);SS('translating','翻译中');
  tr(text).then(function(r){if(r){queue.push(r);flush()}})}
document.getElementById('ti').addEventListener('keydown',function(e){if(e.key==='Enter')sendText()});

// ── QUEUE ──
function flush(){if(busy||!queue.length)return;busy=!0;var t=queue.shift();speak(t).then(function(){busy=!1;if(queue.length)flush();else SS('idle','就绪')})}

// ── FULL TEST ──
function testFull(){var t='ياخشىمۇسىز';sub('测试: '+t,'维吾尔语: ياخشىمۇسىز (你好)');queue.push(t);flush()}

// ── RECOGNITION ──
function toggle(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){sub('','请用 Chrome 或直接打字');L('❌ 浏览器不支持语音识别','err');return}active?stop():start()}
function start(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;rec=new SR;rec.lang='zh-CN';rec.continuous=!0;rec.interimResults=!0;rec.maxAlternatives=1;rec.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++){if(!e.results[i].isFinal)continue;var t=e.results[i][0].transcript.trim();if(t.length<2)continue;L('🎤 '+t);SS('translating','翻译中');tr(t).then(function(r){if(r){queue.push(r);flush()}})}};rec.onerror=function(e){if(e.error==='no-speech'){if(active)SS('listening','监听中');return}if(e.error==='aborted')return;if(e.error==='not-allowed'){L('❌ 麦克风权限被拒','err');stop();return}L('⚠ '+e.error,'warn')};rec.onend=function(){if(active)setTimeout(function(){if(active)try{rec.start()}catch(_){}},200)};rec.start();active=!0;document.getElementById('mb').classList.add('rec');document.getElementById('mbt').textContent='停止监听';SS('listening','监听中...');sub('','🎤 请说中文...');L('🎤 已启动','ok')}
function stop(){active=!1;if(rec){rec.stop();rec=null}queue=[];busy=!1;if(window.speechSynthesis)speechSynthesis.cancel();document.getElementById('mb').classList.remove('rec');document.getElementById('mbt').textContent='语音监听 (Chrome)';SS('idle','就绪');sub('输入文字或按语音按钮','');L('⏹ 已停止')}
if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){speechSynthesis.getVoices()}}
document.addEventListener('click',function(){getAC()},{once:!0});document.addEventListener('touchend',function(){getAC()},{once:!0});
L('✅ 就绪 — Google 翻译 + Google TTS','ok');
</script>
</body>
</html>

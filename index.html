<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电影语音翻译 — 中文→维/乌实时翻译</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
  :root {
    --bg: #09090b; --card: #18181b; --border: #27272a;
    --accent: #8b5cf6; --accent2: #a78bfa; --danger: #ef4444;
    --text: #f4f4f5; --muted: #a1a1aa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px; }

  .lang-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 14px 16px; border-radius: 14px;
    cursor: pointer; transition: all 0.2s;
    border: 2px solid var(--border);
    background: transparent; color: var(--text);
    font-size: 0.9rem; text-align: left; font-family: inherit;
  }
  .lang-btn:hover { border-color: var(--accent2); }
  .lang-btn.active { border-color: var(--accent); background: rgba(139,92,246,0.1); }
  .lang-btn .emoji { font-size: 1.4rem; }
  .lang-btn .title { font-weight: 600; display: block; }
  .lang-btn .sub { font-size: 0.75rem; color: var(--muted); display: block; margin-top: 2px; }

  .main-btn {
    width: 100%; padding: 16px 24px; border-radius: 100px;
    border: none; cursor: pointer; font-weight: 700; font-size: 1rem;
    transition: all 0.3s ease; letter-spacing: 0.03em;
    background: var(--accent); color: white;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-family: inherit;
  }
  .main-btn:hover { filter: brightness(1.15); }
  .main-btn:active { transform: scale(0.97); }
  .main-btn.recording { background: var(--danger); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
    50% { box-shadow: 0 0 0 18px rgba(239,68,68,0); }
  }

  .status-row {
    display: flex; align-items: center; gap: 14px;
    padding: 16px; border-radius: 14px; background: rgba(0,0,0,0.3);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .dot.idle { background: var(--muted); }
  .dot.listening { background: #22c55e; animation: dotP 1s infinite; }
  .dot.translating { background: #f59e0b; animation: dotP 0.5s infinite; }
  .dot.speaking { background: #8b5cf6; animation: dotP 0.6s infinite; }
  .dot.error { background: var(--danger); }
  @keyframes dotP {
    0%, 100% { box-shadow: 0 0 0 0 currentColor; }
    50% { box-shadow: 0 0 0 12px transparent; }
  }

  .waves { display: flex; align-items: flex-end; gap: 2px; height: 32px; margin-left: auto; }
  .waves .w { width: 3px; background: var(--accent2); border-radius: 2px; opacity: 0.7; }

  .log-line {
    font-size: 0.75rem; color: var(--muted); padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    font-family: 'SF Mono', 'Consolas', monospace;
  }
  .log-line.ok { color: #4ade80; }
  .log-line.err { color: #f87171; }
  .log-line.info { color: #60a5fa; }

  .test-btn {
    width: 100%; padding: 10px; border-radius: 12px;
    border: 1px dashed var(--border); background: transparent;
    color: var(--muted); cursor: pointer; font-size: 0.8rem;
    transition: all 0.2s; font-family: inherit;
  }
  .test-btn:hover { border-color: var(--accent2); color: var(--accent2); }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div class="w-full max-w-md mx-auto">
  <div class="text-center mb-6">
    <div class="text-3xl mb-2">🎬</div>
    <h1 class="text-xl font-bold">电影语音翻译</h1>
    <p class="text-xs text-[var(--muted)] mt-1">中文 → 维吾尔语/乌兹别克语 · 纯音频输出</p>
  </div>

  <div class="card space-y-4 mb-4">
    <!-- Lang -->
    <div class="grid grid-cols-2 gap-3">
      <button class="lang-btn active" onclick="selectLang('ug', this)" id="btn-ug">
        <span class="emoji">🏴</span>
        <span><span class="title">维吾尔语</span><span class="sub">Uyghur</span></span>
      </button>
      <button class="lang-btn" onclick="selectLang('uz', this)" id="btn-uz">
        <span class="emoji">🇺🇿</span>
        <span><span class="title">乌兹别克语</span><span class="sub">Uzbek</span></span>
      </button>
    </div>

    <!-- Status -->
    <div class="status-row">
      <span class="dot idle" id="dot"></span>
      <div class="min-w-0 flex-1">
        <div class="font-semibold text-sm" id="title">就绪</div>
        <div class="text-xs text-[var(--muted)] mt-0.5 truncate" id="desc">点击「开始监听」即可</div>
      </div>
      <div class="waves" id="waves"></div>
    </div>

    <!-- Buttons -->
    <button class="main-btn" id="mainBtn" onclick="toggle()">
      <i class="fa fa-microphone"></i>
      <span id="btnLabel">开始监听</span>
    </button>

    <!-- Test audio -->
    <button class="test-btn" onclick="testAudio()">
      <i class="fa fa-volume-up"></i> 测试音频播放
    </button>

    <!-- Log -->
    <div id="log" class="max-h-32 overflow-y-auto space-y-0"></div>
  </div>

  <p class="text-xs text-[var(--muted)] text-center">
    💡 戴耳机 → 麦克风靠近耳机 → 说话即可翻译
  </p>
</div>

<script>
// ── State ──
let target = 'ug';
let active = false;
let recognition = null;
let utteranceQueue = [];
let speaking = false;
let audioCtx = null;

// ── Logging ──
function log(msg, cls = '') {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  el.innerHTML += `<div class="log-line ${cls}">${time} ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
  // Keep max 50 lines
  while (el.children.length > 50) el.firstChild.remove();
}

// ── Lang ──
function selectLang(lang, el) {
  target = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  log(`目标语言: ${lang === 'ug' ? '维吾尔语' : '乌兹别克语'}`, 'info');
}

// ── Status ──
function status(state, title, desc) {
  document.getElementById('dot').className = 'dot ' + state;
  document.getElementById('title').textContent = title;
  document.getElementById('desc').textContent = desc || '';
  waves(state);
}

function waves(state) {
  const c = document.getElementById('waves');
  if (state === 'idle') { c.innerHTML = ''; return; }
  const n = 12;
  c.innerHTML = Array.from({length: n}, () => '<div class="w"></div>').join('');
  if (state === 'listening') {
    const loop = () => {
      if (!active) { c.innerHTML = ''; return; }
      c.querySelectorAll('.w').forEach(w => {
        w.style.height = (4 + Math.random() * 24) + 'px';
      });
      requestAnimationFrame(() => setTimeout(loop, 70));
    };
    loop();
  }
}

// ── Audio Context (bypass autoplay restrictions) ──
function ensureAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// ── TTS — Core ──
async function speak(text) {
  log(`🔊 尝试播放: "${text.slice(0, 40)}..."`, 'info');

  // Strategy 1: Google TTS direct
  const googleURLs = [
    `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${target}&q=${encodeURIComponent(text)}`,
    `https://translate.google.cn/translate_tts?ie=UTF-8&client=tw-ob&tl=${target}&q=${encodeURIComponent(text)}`,
  ];

  for (const url of googleURLs) {
    try {
      const resp = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (resp.ok) {
        const blob = await resp.blob();
        if (blob.size > 500) {
          await playBlob(blob);
          log('✓ Google TTS 播放成功', 'ok');
          return;
        }
      }
    } catch(e) { /* next */ }
  }

  // Strategy 2: Browser SpeechSynthesis
  log('Google TTS 不可用，尝试浏览器内置 TTS...');
  try {
    await browserTTS(text);
    log('✓ 浏览器 TTS 播放成功', 'ok');
    return;
  } catch(e) {
    log(`浏览器 TTS 失败: ${e.message}`, 'err');
  }

  log('所有 TTS 方案均失败，请检查网络连接', 'err');
}

function playBlob(blob) {
  return new Promise((resolve, reject) => {
    ensureAudioCtx();
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const buffer = await audioCtx.decodeAudioData(reader.result);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.onended = resolve;
        source.start();
      } catch(e) {
        // Fallback: use <audio> element
        const url = URL.createObjectURL(blob);
        const a = new Audio(url);
        a.onended = resolve;
        a.onerror = () => reject(new Error('audio playback failed'));
        a.play().catch(reject);
      }
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function browserTTS(text) {
  return new Promise((resolve, reject) => {
    const synth = window.speechSynthesis;
    if (!synth) return reject(new Error('SpeechSynthesis not supported'));

    const doSpeak = () => {
      const voices = synth.getVoices();
      if (voices.length === 0) return reject(new Error('no voices available'));

      // Find matching voice or use any available
      const voice = voices.find(v => v.lang.startsWith(target)) ||
                    voices.find(v => v.lang.includes('zh')) ||
                    voices[0];

      log(`使用语音: ${voice.name} (${voice.lang})`);

      const u = new SpeechSynthesisUtterance(text);
      u.voice = voice;
      u.rate = 0.85;
      u.pitch = 1.0;
      u.volume = 1.0;
      u.onend = () => resolve();
      u.onerror = (e) => reject(new Error(`TTS error: ${e.error}`));
      synth.speak(u);
    };

    if (synth.getVoices().length > 0) {
      doSpeak();
    } else {
      const timeout = setTimeout(() => reject(new Error('voices load timeout')), 3000);
      synth.onvoiceschanged = () => {
        clearTimeout(timeout);
        doSpeak();
      };
    }
  });
}

// ── Test Audio ──
async function testAudio() {
  ensureAudioCtx();
  log('🔈 开始音频测试...', 'info');
  const testText = target === 'ug' ? 'ياخشىمۇسىز' : "Salom, dunyo";
  try {
    await speak(testText);
    log('✓ 测试音频播放完成', 'ok');
  } catch(e) {
    log(`测试音频失败: ${e.message}`, 'err');
  }
}

// ── Translate ──
async function translate(text) {
  log(`📝 翻译: "${text.slice(0, 35)}..."`);

  // Backend 1: Google
  const googleURLs = [
    `https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=${target}&dt=t&q=${encodeURIComponent(text)}`,
    `https://translate.google.cn/translate_a/single?client=gtx&sl=zh-CN&tl=${target}&dt=t&q=${encodeURIComponent(text)}`,
    `https://translate-pa.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=${target}&dt=t&q=${encodeURIComponent(text)}`,
  ];

  for (const url of googleURLs) {
    try {
      const r = await fetch(url, { signal: AbortSignal.timeout(6000) });
      const d = await r.json();
      if (d?.[0]) {
        const result = d[0].map(p => p[0]).join('');
        log(`✓ 翻译结果: "${result.slice(0, 40)}..."`, 'ok');
        return result;
      }
    } catch(e) { /* next */ }
  }

  // Backend 2: MyMemory
  try {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh|${target}`;
    const r = await fetch(url, { signal: AbortSignal.timeout(6000) });
    const d = await r.json();
    if (d?.responseData?.translatedText) {
      log(`✓ MyMemory: "${d.responseData.translatedText.slice(0, 40)}..."`, 'ok');
      return d.responseData.translatedText;
    }
  } catch(e) { /* next */ }

  log('所有翻译后端均失败', 'err');
  return null;
}

// ── Queue ──
async function flushQueue() {
  if (speaking || utteranceQueue.length === 0) return;
  speaking = true;
  const text = utteranceQueue.shift();
  status('speaking', '播放翻译中...');
  await speak(text);
  speaking = false;
  if (utteranceQueue.length > 0) {
    flushQueue();
  } else if (active) {
    status('listening', '监听中...', '等待语音输入');
  } else {
    status('idle', '就绪');
  }
}

// ── Recognition ──
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    log('浏览器不支持语音识别，请使用 Chrome 或 Edge', 'err');
    alert('请使用 Chrome 或 Edge 浏览器打开此页面');
    return null;
  }
  const rec = new SR();
  rec.lang = 'zh-CN';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  return rec;
}

// ── Toggle ──
function toggle() {
  if (active) { stop(); return; }
  start();
}

function start() {
  ensureAudioCtx();

  recognition = initRecognition();
  if (!recognition) return;

  recognition.onresult = async e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal) continue;
      const text = e.results[i][0].transcript.trim();
      if (text.length < 2) continue;
      log(`🎤 识别: "${text}"`);
      status('translating', '翻译中...', text.slice(0, 30) + (text.length > 30 ? '…' : ''));
      const result = await translate(text);
      if (result) {
        utteranceQueue.push(result);
        flushQueue();
      } else {
        status('listening', '监听中...', '翻译失败，请检查网络');
      }
    }
  };

  recognition.onerror = e => {
    if (e.error === 'no-speech') {
      if (active) status('listening', '监听中...', '等待语音输入');
      return;
    }
    if (e.error === 'aborted') return;
    if (e.error === 'not-allowed') {
      log('麦克风权限被拒绝！请在浏览器设置中允许麦克风', 'err');
      status('error', '麦克风权限被拒绝');
      stop();
      return;
    }
    log(`语音识别错误: ${e.error}`, 'err');
    if (active) status('listening', '识别出错', '正在恢复...');
  };

  recognition.onend = () => {
    if (active) {
      setTimeout(() => {
        if (active) try { recognition.start(); } catch(_) {}
      }, 200);
    }
  };

  try {
    recognition.start();
    active = true;
    document.getElementById('mainBtn').classList.add('recording');
    document.getElementById('btnLabel').textContent = '停止翻译';
    document.getElementById('mainBtn').querySelector('i').className = 'fa fa-stop';
    status('listening', '监听中...', '请开始说话');
    log('🎤 开始监听...', 'ok');
  } catch(e) {
    log(`启动失败: ${e.message}`, 'err');
    status('error', '启动失败', e.message);
  }
}

function stop() {
  active = false;
  if (recognition) { recognition.stop(); recognition = null; }
  utteranceQueue = [];
  window.speechSynthesis?.cancel();
  speaking = false;
  document.getElementById('mainBtn').classList.remove('recording');
  document.getElementById('btnLabel').textContent = '开始监听';
  document.getElementById('mainBtn').querySelector('i').className = 'fa fa-microphone';
  status('idle', '已停止');
  document.getElementById('waves').innerHTML = '';
  log('⏹ 已停止');
}

// Preload
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
</script>
</body>
</html>
